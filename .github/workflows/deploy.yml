name: deploy

on:
  push:
    branches: [main]
  # The measured repositories keep moving even when this one does not.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  # Never cancel a deploy midway; a newer run waits for it instead.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Action SHAs resolved from the upstream release tags noted beside each.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # Full acquisition (git + GitHub overlay + branches + council), then derive
      # and verify. Any failure fails this job, nothing is uploaded, and the
      # deploy job does not run: the previously published site stays live.
      # There is no fallback to a git-only site.
      - run: bun run build:full
        env:
          GH_TOKEN: ${{ github.token }}
      # Publish an allow-listed copy of site/, never the source directory.
      - run: bun run stage
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
