<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UCP Contributor Stats</title>
<link rel="stylesheet" href="./style.css">
<!-- Declaring an icon is what stops the automatic /favicon.ico request, so this
     removes a 404 from every page load rather than only dressing the tab. -->
<link rel="icon" href="./icon.svg" type="image/svg+xml">
</head>
<body>
<header>
  <div class="wrap">
    <!-- Mark from ucp.dev/assets/UCP-small.svg. Inlined rather than <img> for two
         reasons: it is 3 paths and costs less than the request, and currentColor
         lets it take the masthead's ink instead of being locked to black. Sized
         by CSS (.mark); the width/height attributes are only a sane fallback for
         a stylesheet that does not know about it. role+aria-label because the
         mark is the only place "UCP" appears now that the wordmark reads
         "Contributor Stats". -->
    <div class="brand">
      <svg class="mark" width="22" height="23" viewBox="0 0 30 31" fill="none"
           xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UCP">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M27 10L16 16.6658V30L27 23.3329V20.8325L18.1149 26.2495V17.9159L27 12.499V10Z" fill="currentColor" stroke="currentColor" stroke-width="0.2"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M4.30688 11.2488L2 10V23.3329L14 30V16.6658L11.6916 15.4156V26.2495L4.30688 22.0827V11.2488Z" fill="currentColor" stroke="currentColor" stroke-width="0.2"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M15.1296 1L3 8L15 15L17.3859 13.6979L15 12.3563L25 6.65981L15.1296 1ZM12.7681 10.9978L7.59675 7.9732L15.1296 3.62535L20.3551 6.64148L12.7681 10.9992V10.9978Z" fill="currentColor" stroke="currentColor" stroke-width="0.2"/>
      </svg>
      <h1>Contributor Stats</h1>
    </div>
    <p class="sub" id="sub"></p>
    <nav>
      <a href="#/orgs">Organizations</a>
      <a href="#/repos">Repositories</a>
      <a href="#/people">Contributors</a>
      <a href="#/heartbeat">Heartbeat</a>
      <a href="#/governance">Governance</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="view"></div>
</main>

<footer class="wrap">
  <p>
    <a class="link" href="https://github.com/igrigorik/ucp-contributors">Source</a> ·
    <a class="link" href="https://github.com/igrigorik/ucp-contributors/blob/main/README.md#how-we-count">Methodology</a> ·
    <a class="link" href="https://github.com/igrigorik/ucp-contributors/blob/main/docs/CONTRIBUTING.md">Correct a record</a> ·
    <a class="link" href="https://github.com/igrigorik/ucp-contributors/blob/main/docs/GOVERNANCE.md">Governance sources</a>
  </p>
</footer>

<script type="module" src="./app.js"></script>
</body>
</html>
